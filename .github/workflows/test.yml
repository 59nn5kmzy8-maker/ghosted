name: test
on: [push, workflow_dispatch]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
      - name: Windows console typing (type-keys.ps1)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./ci/windows/e2e.ps1
