  const live = on => { if (!frame) return; frame.classList.toggle('live', on); clearTimeout(offTimer); if (on) offTimer = setTimeout(() => frame.classList.remove('live'), 1500); };
  addEventListener('wheel', e => {
    const dy = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
    if (parent.__dashStop(dy)) { e.preventDefault(); live(true); return; }
    const below = parent.__dashTop() > 1; // not at the stop line yet
    const atTop = se.scrollTop <= 0, atEnd = se.scrollTop + innerHeight >= se.scrollHeight - 1;
    if ((dy > 0 && (below || atEnd)) || (dy < 0 && atTop)) {
      e.preventDefault();
      parent.scrollBy({ top: dy, left: 0, behavior: 'instant' });
      live(false);
    } else live(true);
  }, { passive: false });
}
